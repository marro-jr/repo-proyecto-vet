<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Usuarios - Veterinaria Pet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/usuarios">🐾 Veterinaria Pet</a>
            <div class="d-flex align-items-center">
                <span class="text-white-50 me-3 small d-none d-md-inline">Módulo de Usuarios</span>
                <a href="/logout" class="btn btn-outline-light btn-sm">Cerrar Sesión</a>
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                <h5 class="mb-0 fw-bold text-secondary">Listado de Usuarios Registrados</h5>
                <a href="/usuarios/nuevo" class="btn btn-success btn-sm fw-semibold">
                    + Nuevo Usuario
                </a>
            </div>

            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="text-center" style="width: 70px;">ID</th>
                                <th>Nombre</th>
                                <th>Apellido</th>
                                <th>Correo</th>
                                <th>Rol</th>
                                <th class="text-center">Estado</th>
                                <th class="text-center" style="width: 200px;">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="u : ${usuarios}">
                                <td class="text-center fw-bold" th:text="${u.idUsuario}">1</td>
                                <td th:text="${u.nombre}">Juan</td>
                                <td th:text="${u.apellido}">Perez</td>
                                <td th:text="${u.correo}">juan@vet.com</td>
                                <td>
                                    <span class="badge bg-info text-dark" th:text="${u.rol != null ? u.rol.nombre : 'Sin Rol'}">ADMIN</span>
                                </td>
                                <td class="text-center">
                                    <span th:if="${u.estado == T(com.veterinary.pet.entity.EstadoUsuario).ACTIVO}" class="badge bg-success">
                                        ACTIVO
                                    </span>
                                    <span th:if="${u.estado == T(com.veterinary.pet.entity.EstadoUsuario).INACTIVO}" class="badge bg-secondary">
                                        INACTIVO
                                    </span>
                                </td>
                                <td class="text-center">
                                    <a th:href="@{/usuarios/editar/{id}(id=${u.idUsuario})}" class="btn btn-sm btn-outline-primary me-1">
                                        Editar
                                    </a>
                                    <a th:if="${u.estado == T(com.veterinary.pet.entity.EstadoUsuario).ACTIVO}"
                                       th:href="@{/usuarios/desactivar/{id}(id=${u.idUsuario})}"
                                       class="btn btn-sm btn-outline-danger"
                                       onclick="return confirm('¿Está seguro de desactivar este usuario?');">
                                        Desactivar
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(usuarios)}">
                                <td colspan="7" class="text-center py-4 text-muted">
                                    No hay usuarios registrados actualmente.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
